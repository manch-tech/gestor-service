async function importGoogle(){
  // Fallback nativo do celular - nao precisa Google
  try{
    if(navigator.contacts && window.ContactsManager){
      let props=["name","tel"];
      let c=await navigator.contacts.select(props,{multiple:false});
      if(c && c[0]){
        document.getElementById("orc_nome").value=c[0].name[0];
        document.getElementById("orc_tel").value=c[0].tel[0];
        showToast("Contato celular OK");
        render();
        return;
      }
    }
  }catch(e){}

  gLoad=true;render();
  try{
    if(typeof google==="undefined"||!google.accounts){
      showToast("Carregando Google...");
      gLoad=false;render();
      setTimeout(importGoogle,1500);
      return;
    }
    let client=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:"https://www.googleapis.com/auth/contacts.readonly",
      ux_mode:"popup",
      prompt:"",
      callback:async function(r){
        if(r && r.access_token){
          try{
            let resp=await fetch("https://people.googleapis.com/v1/people/me/connections?personFields=names,phoneNumbers,emailAddresses&pageSize=200",{headers:{Authorization:"Bearer "+r.access_token}});
            let data=await resp.json();
            if(data.error){
              showToast("Ative People API em console.cloud.google.com - "+data.error.message);
              gLoad=false;render();return;
            }
            gContacts=(data.connections||[]).map(function(p){
              return{
                name:p.names?p.names[0].displayName:"Sem nome",
                phone:p.phoneNumbers?p.phoneNumbers[0].value:"",
                email:p.emailAddresses?p.emailAddresses[0].value:""
              };
            });
            showGoogle=true;
          }catch(e){showToast("Erro buscar: "+e.message);}
        }
        gLoad=false;render();
      },
      error_callback:function(err){
        gLoad=false;
        console.log(err);
        if(err.type==="access_denied"){
          showToast("Google bloqueou. Va em console.cloud.google.com > Tela consentimento > Usuarios de teste > adicione seu email e Publique o app + adicione https://manch-tech.github.io em Origens JS autorizadas");
        }else{
          showToast("Erro Google: "+(err.message||err.type));
        }
        render();
      }
    });
    client.requestAccessToken({prompt:""});
  }catch(e){gLoad=false;showToast("Erro: "+e.message);render();}
}
function pickGoogle(i){let c=gContacts[i];let el1=document.getElementById("orc_nome");if(el1)el1.value=c.name;let el2=document.getElementById("orc_tel");if(el2)el2.value=c.phone;showGoogle=false;render();}

function login(){

}
try{
