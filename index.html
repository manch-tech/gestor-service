:root{color-scheme: light;}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;}
@media print{
  .no-print{display:none!important}
  body{background:white!important}
  .print-area{border:none!important;box-shadow:none!important}
}
.input{border:1.5px solid #cbd5e1;background:white;border-radius:12px;padding:0 14px;height:42px;width:100%;font-size:14px}
.textarea{border:1.5px solid #cbd5e1;background:white;border-radius:12px;padding:10px 14px;width:100%;font-size:14px;min-height:90px}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block;color:#334155}
.card{background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.04)}

.google-busca-btn.google-loading{opacity:.85;cursor:wait;transform:scale(.98)}
.google-spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:googleSpin .7s linear infinite;vertical-align:-1px}
@keyframes googleSpin{to{transform:rotate(360deg)}}
.menu-item{background:white;color:#0f172a}
.menu-item:hover{background:#f4f4f5}
.menu-item.bg-zinc-900{color:white}

<body class="min-h-screen">

<!-- TELA LOGIN V8 UNICO -->
<div id="tela-login" class="fixed inset-0 z-[9999] bg-zinc-950 flex items-center justify-center p-4">
<div class="bg-white rounded-[24px] p-8 max-w-[380px] w-full shadow-2xl border flex flex-col items-center text-center">
<img src="./logo-gestor-service.png?v=4" alt="Gestor Service" class="w-36 h-36 object-contain mb-6 mx-auto block">
    
    <h2 class="font-bold text-[18px]">Gestor Service</h2>
    <p class="text-xs text-zinc-500 mt-1">Acesso restrito - Manoel Pedra</p>
    <div class="mt-6">
      <input id="login-email" placeholder="Email" type="email" autocomplete="username" class="w-full h-11 border border-zinc-200 rounded-xl px-4 text-sm">
      <div class="relative mt-3">
        <input id="login-senha" placeholder="Senha" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()" class="w-full h-11 border border-zinc-200 rounded-xl pl-4 pr-11 text-sm">
        <button type="button" onclick="toggleLoginSenha()" aria-label="Mostrar senha" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-zinc-500 hover:text-zinc-900">
          <span id="login-senha-olho">👁️</span>
        </button>
      </div>
      <div id="login-erro" class="hidden mt-3 text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-xl"></div>
      <div id="login-info" class="hidden mt-3 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 p-3 rounded-xl"></div>
      <div class="mt-3 flex justify-center">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEhZP7YNS-Cy05_Q" data-size="flexible"></div>
      </div>
      <button id="btn-login" onclick="fazerLogin()" class="mt-4 w-full h-11 bg-zinc-900 text-white rounded-xl font-bold text-sm">Entrar</button>
      <button onclick="esqueciSenha()" type="button" class="mt-3 w-full text-center text-[11px] text-zinc-500 underline">Esqueci minha senha</button>
    </div>
  </div>
</div>

<!-- TELA NOVA SENHA (usada quando o usuário clica no link de recuperação) -->
<div id="tela-nova-senha" class="hidden fixed inset-0 z-[9999] bg-zinc-950 flex items-center justify-center p-4">
  <div class="bg-white rounded-[24px] p-8 max-w-[380px] w-full shadow-2xl border">
<img src="./logo-gestor-service.png" alt="GS" class="w
object-contain rounded-xl shrink-0">
    <h2 class="font-bold text-[18px]">Definir nova senha</h2>

<!-- TEMPLATE-01 -->
<template id="app-template">

<header class="no-print sticky top-0 z-20 bg-white border-b">
  <div class="max-w-[1200px] mx-auto px-3 min-h-[72px] py-2 flex items-center justify-between gap-2 flex-nowrap">
    <div class="flex items-center gap-2 min-w-0">
<img src="./gestor-icon.png?v=4" alt="Gestor Service" class="w-14 h-14 object-contain rounded-xl shrink-0">

      <div class="min-w-0">
        <b class="text-sm block truncate">Gestor Service</b>

    </div>
    <div id="header-right" class="flex items-center gap-2 shrink-0">

        <button id="menu-toggle" onclick="toggleMenu(event)" class="h-9 px-3 sm:px-4 rounded-full bg-zinc-900 text-white text-xs font-bold flex items-center gap-1.5">

          <svg id="menu-caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="transition-transform"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="menu-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white border border-zinc-200 rounded-2xl shadow-xl overflow-hidden z-30 py-1">

          <button onclick="mostrarAba('os')" id="btn-os" class="menu-item block w-full text-left px-4 py-2.5 text-xs rounded-lg mx-1 my-0.5" style="width:calc(100% - 8px)">OS</button>
          <button onclick="mostrarAba('ter')" id="btn-ter" class="menu-item block w-full text-left px-4 py-2.5 text-xs rounded-lg mx-1 my-0.5" style="width:calc(100% - 8px)">Termo Entrega</button>
          <button onclick="mostrarAba('lista')" id="btn-lista" class="menu-item block w-full text-left px-4 py-2.5 text-xs rounded-lg mx-1 my-0.5" style="width:calc(100% - 8px)">Lista / Busca</button>
          <button onclick="mostrarAba('config')" id="btn-config" class="menu-item block w-full text-left px-4 py-2.5 text-xs rounded-lg mx-1 my-0.5" style="width:calc(100% - 8px)">Configurações</button>

<main class="max-w-[1200px] mx-auto px-1 py-6">
  <!-- CABEÇALHO DINÂMICO PREVIEW -->
  <div id="header-preview" class="card p-5 mb-6 print-area"></div>

  <!-- ABA ORÇAMENTO -->
  <div id="aba-orc" class="">
    <div class="card p-6">
      <div class="flex justify-between items-start gap-4">
        <div><h2 class="font-bold text-lg">Novo Orçamento - ORC</h2><p class="text-xs text-zinc-500">Dados ficam salvos e reutilizáveis para OS e TER. Use busca para puxar cliente/serviços já cadastrados.</p></div>
        <div class="flex gap-2"><button onclick="novoORC()" class="h-9 px-4 bg-white border rounded-full text-xs">Novo</button><button onclick="document.getElementById('modal-print-orc').classList.remove('hidden')" class="h-9 px-4 bg-zinc-900 text-white rounded-full text-xs">Imprimir/PDF</button></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-5">
        <div><label class="label">ORC-Número</label><input id="orc_numero" class="input font-mono"></div>
        <div><label class="label">Data</label><input id="orc_data" type="date" class="input"></div>
        <div><label class="label">Validade</label><input id="orc_validade" type="date" class="input"></div>
        <div class="md:col-span-2"><label class="label">Título do orçamento</label><input id="orc_titulo" class="input" placeholder="Ex: Reforma cozinha + elétrica" list="lista-servicos"></div>
        <div><label class="label">Cliente (busca automática) <button type="button" onclick="buscarGoogleContatos()" class="ml-2 text-[10px] px-2 py-0.5 bg-blue-600 text-white rounded-full google-busca-btn">Google</button></label><input id="orc_cliente_nome" class="input" placeholder="Digite para buscar" oninput="autocompleteCliente(this, 'orc')" list="lista-clientes"><datalist id="lista-clientes"></datalist><div id="orc_cliente_sug" class="text-[11px] mt-1"></div></div>
        <div><label class="label">Telefone</label><input id="orc_cliente_telefone" class="input"></div>
        <div><label class="label">Email</label><input id="orc_cliente_email" class="input"></div>
        <div class="md:col-span-3"><label class="label">Endereço do cliente e da obra</label><input id="orc_cliente_endereco" class="input" placeholder="Rua, número, bairro, cidade"></div>
        <div class="md:col-span-3"><label class="label">Descrição geral (opcional, resumo do orçamento)</label><textarea id="orc_descricao" class="textarea" placeholder="Descreva serviços, especialidades: alvenaria, elétrica, hidráulica..."></textarea><datalist id="lista-servicos"></datalist><datalist id="dl-servicos-precos"></datalist><datalist id="dl-materiais-precos"></datalist></div>
        <div class="md:col-span-2"><label class="label">Observações</label><textarea id="orc_obs" class="textarea" placeholder="Prazo, forma de pagamento, garantias..."></textarea></div>
        <input id="orc_valor" type="hidden">

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">SERVIÇOS / MÃO DE OBRA <span class="font-normal text-zinc-400">(opcional — um item por linha, com preço)</span></b></div>
        <div class="md:col-span-3">
          <div id="orc_servicos_itens" class="space-y-2"></div>
          <button type="button" onclick="addItemOrc('servico')" class="mt-2 h-8 px-3 border rounded-full text-xs">+ Adicionar serviço</button>
          <div class="text-right text-xs font-bold mt-2 text-zinc-600">Subtotal serviços: <span id="orc_subtotal_servicos">R$ 0,00</span></div>
        </div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">MATERIAIS <span class="font-normal text-zinc-400">(opcional — um item por linha, com preço)</span></b></div>
        <div class="md:col-span-3">
          <div id="orc_materiais_itens" class="space-y-2"></div>
          <button type="button" onclick="addItemOrc('material')" class="mt-2 h-8 px-3 border rounded-full text-xs">+ Adicionar material</button>
          <div class="text-right text-xs font-bold mt-2 text-zinc-600">Subtotal materiais: <span id="orc_subtotal_materiais">R$ 0,00</span></div>
        </div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">VALORES</b></div>
        <div><label class="label">Valor mão de obra</label><input id="orc_valor_mao_obra" class="input" placeholder="Auto ou manual" oninput="calcTotalOrc()"></div>
        <div><label class="label">Valor materiais</label><input id="orc_valor_materiais" class="input" placeholder="Auto ou manual" oninput="calcTotalOrc()"></div>
        <div><label class="label">Valor total</label><input id="orc_valor_total" class="input font-bold" placeholder="Auto"></div>
        <div class="md:col-span-3"><label class="label">Forma de pagamento</label><select id="orc_forma_pg" class="input"><option>À vista</option><option>Cartão</option><option>A prazo</option><option>PIX</option><option>50% entrada + 50% na entrega</option></select></div>

        <div class="md:col-span-3">
          <label class="label">Anexos - links, fotos, docs (Google Fotos, Dropbox etc)</label>
          <div id="orc_anexos" class="space-y-2"></div>
          <button onclick="addAnexo('orc')" class="mt-2 h-8 px-3 border rounded-full text-xs">+ Adicionar anexo</button>
        </div>
      </div>
      <div class="mt-5 flex gap-2"><button onclick="salvarORC()" class="h-11 px-6 bg-[#ffbf00] rounded-xl font-bold text-sm">Salvar Orçamento</button><span id="orc_status" class="text-xs text-zinc-500 self-center"></span></div>
    </div>
    <div id="lista-orc-recente" class="mt-6"></div>
  </div>

  <!-- MODAL OPÇÕES DE IMPRESSÃO ORC -->
  <div id="modal-print-orc" class="hidden fixed inset-0 z-[9998] bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-[380px] w-full">
      <b class="text-sm">Como deseja imprimir o Orçamento?</b>
      <div class="mt-4 space-y-2">
        <button onclick="imprimirDoc('orc','completo')" class="w-full h-12 border rounded-xl text-sm text-left px-4 hover:bg-zinc-50">📋 <b>Completo</b><br><span class="text-[11px] text-zinc-500">Todos os itens, valores individuais e subtotais</span></button>
        <button onclick="imprimirDoc('orc','subtotais')" class="w-full h-12 border rounded-xl text-sm text-left px-4 hover:bg-zinc-50">📊 <b>Resumido</b><br><span class="text-[11px] text-zinc-500">Só subtotal de mão de obra, materiais e total</span></button>
        <button onclick="imprimirDoc('orc','total')" class="w-full h-12 border rounded-xl text-sm text-left px-4 hover:bg-zinc-50">💰 <b>Somente total</b><br><span class="text-[11px] text-zinc-500">Só o valor total, sem detalhamento</span></button>
      </div>
      <button onclick="document.getElementById('modal-print-orc').classList.add('hidden')" class="mt-4 text-xs underline text-zinc-500">Cancelar</button>
    </div>
  </div>

  <!-- MODAL SELEÇÃO DE CONTATO GOOGLE -->
  <div id="modal-google-contatos" class="hidden fixed inset-0 z-[9998] bg-black/50 flex items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-none sm:rounded-2xl p-4 sm:p-5 max-w-[520px] w-full h-full sm:h-auto max-h-screen sm:max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-3"><div><b class="text-sm">Selecionar contato do Google</b><div class="text-[10px] text-zinc-500 mt-0.5">Toque em um contato para abrir todos os dados disponíveis.</div></div><button onclick="document.getElementById('modal-google-contatos').classList.add('hidden')" class="text-xs underline">Fechar</button></div>
      <input id="google-contatos-filtro" class="input mb-3" placeholder="Filtrar por nome, telefone ou e-mail..." oninput="filtrarContatosGoogle()">
      <div id="google-contatos-lista" class="overflow-auto space-y-1"></div>
    </div>
  </div>

  <!-- MODAL DETALHES DO CONTATO GOOGLE -->
  <!-- MODAL DETALHE COMPLETO DO CONTATO GOOGLE -->
  <div id="modal-google-contato-detalhe" class="hidden fixed inset-0 z-[10000] bg-black/50 flex items-center justify-center p-0 sm:p-3">
    <div class="bg-white rounded-none sm:rounded-2xl p-4 sm:p-5 max-w-[620px] w-full h-full sm:h-auto max-h-screen sm:max-h-[92vh] overflow-auto">
      <div class="flex justify-between items-center mb-2">
        <div>
          <b class="text-base">Dados completos do contato</b>
          <div id="google-detalhe-subtitulo" class="text-[11px] text-zinc-500 mt-1"></div>
        </div>
        <button onclick="fecharDetalheContatoGoogle()" class="text-xs underline">Fechar</button>
      </div>
      <div class="flex gap-2 mb-4">
        <button onclick="copiarTodosDadosGoogle()" class="h-9 px-3 border rounded-xl text-xs">Copiar todos os dados</button>
      </div>
      <div id="google-detalhe-conteudo" class="space-y-3"></div>
      <div class="flex gap-2 mt-5 sticky bottom-0 bg-white pt-3">
        <button onclick="fecharDetalheContatoGoogle()" class="flex-1 h-11 border rounded-xl text-sm">Voltar</button>
        <button onclick="usarContatoGoogleAtual()" class="flex-1 h-11 bg-zinc-900 text-white rounded-xl text-sm">Usar este contato</button>
      </div>
    </div>
  </div>

  <!-- ABA OS -->
  <div id="aba-os" class="hidden">
    <div class="card p-6">
      <div class="flex justify-between"><h2 class="font-bold text-lg">Ordem de Serviço - OS</h2><div class="flex gap-2"><button onclick="novoOS()" class="h-9 px-4 bg-white border rounded-full text-xs">Nova OS</button><button onclick="imprimirDoc('os')" class="h-9 px-4 bg-zinc-900 text-white rounded-full text-xs">Imprimir/PDF</button></div></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-5">
        <div><label class="label">OS-Número</label><input id="os_numero" class="input font-mono"></div>
        <div><label class="label">Título</label><input id="os_titulo" class="input"></div>
        <div><label class="label">ORC-Número / Pedido (puxa dados)</label><input id="os_orc_numero" class="input font-mono" placeholder="ORC-..." list="lista-orc-numeros" oninput="puxarORCparaOS()"><datalist id="lista-orc-numeros"></datalist><datalist id="lista-os-numeros"></datalist></div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">CLIENTE</b></div>
        <div><label class="label">Nome do cliente <button onclick="buscarGoogleContatos()" type="button" class="ml-2 text-[10px] px-2 py-0.5 bg-blue-600 text-white rounded-full google-busca-btn">Google</button></label><input id="os_cliente_nome" class="input" list="lista-clientes" oninput="autocompleteCliente(this,'os')"></div>
        <div><label class="label">Telefone</label><input id="os_cliente_telefone" class="input"></div>
        <div><label class="label">Email</label><input id="os_cliente_email" class="input"></div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">SERVIÇO</b></div>
        <div class="md:col-span-3"><label class="label">Endereço da obra</label><input id="os_endereco_obra" class="input"></div>
        <div><label class="label">Trabalho Autorizado por</label><input id="os_autorizado_por" class="input"></div>
        <div><label class="label">Data início estimada</label><input id="os_data_inicio" type="date" class="input"></div>
        <div><label class="label">Data término estimada</label><input id="os_data_fim" type="date" class="input"></div>
        <div class="md:col-span-3"><label class="label">Descrição dos serviços</label><textarea id="os_descricao" class="textarea" list="lista-servicos"></textarea></div>
        <div class="md:col-span-3"><label class="label">Comentários</label><textarea id="os_comentarios" class="textarea"></textarea></div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">VALORES</b></div>
        <div><label class="label">Mão de obra</label><input id="os_mao_obra" class="input" oninput="calcTotalOS()"></div>
        <div><label class="label">Materiais</label><input id="os_materiais" class="input" oninput="calcTotalOS()"></div>
        <div><label class="label">Total</label><input id="os_total" class="input font-bold"></div>
        <div class="md:col-span-3"><label class="label">Forma de pagamento</label><select id="os_forma_pg" class="input"><option>À vista</option><option>Cartão</option><option>A prazo</option><option>PIX</option><option>50% entrada + 50% na entrega</option></select></div>

        <div class="md:col-span-3 border-t pt-4"><b class="text-xs">ASSINATURA</b></div>
        <div><label class="label">Nome e função do cliente/representante</label><input id="os_rep_nome" class="input"></div>
        <div class="md:col-span-2"><label class="label">Assinatura e CPF</label><input id="os_rep_cpf" class="input" placeholder="Assina: ___ CPF: ___"></div>
      </div>
      <div class="mt-5 flex gap-2"><button onclick="salvarOS()" class="h-11 px-6 bg-[#ffbf00] rounded-xl font-bold text-sm">Salvar OS</button><span id="os_status" class="text-xs text-zinc-500 self-center"></span></div>
    </div>
    <div id="lista-os-recente" class="mt-6"></div>
  </div>

  <!-- ABA TERMO -->

function toggleMenu(ev){
  if(ev) ev.stopPropagation();
  const dd=document.getElementById('menu-dropdown');
  const caret=document.getElementById('menu-caret');
  if(!dd) return;
  const abrir=dd.classList.contains('hidden');
  dd.classList.toggle('hidden');
  if(caret) caret.style.transform = abrir ? 'rotate(180deg)' : '';
}
function closeMenu(){
  const dd=document.getElementById('menu-dropdown');
  const caret=document.getElementById('menu-caret');
  if(dd) dd.classList.add('hidden');
  if(caret) caret.style.transform='';
}
document.addEventListener('click', (ev)=>{

});

// =========================================================
// GOOGLE CONTACTS - OAuth Authorization Code + Edge Function
// =========================================================
let googleContatosCache = [];
let googleCodeClient = null;

const GOOGLE_FUNCTION_URL =
  'https://wybgqdreqylrojdxijey.supabase.co/functions/v1/google-contacts';

const GOOGLE_CONTACTS_SCOPE =
  'https://www.googleapis.com/auth/contacts.readonly ' +
  'https://www.googleapis.com/auth/contacts.other.readonly';

function setGoogleBuscaLoading(loading){
  document.querySelectorAll('.google-busca-btn').forEach(btn=>{
    if(loading){
      if(!btn.dataset.googleOriginalText) btn.dataset.googleOriginalText = btn.textContent.trim() || 'Google';
      btn.disabled = true;
      btn.classList.add('google-loading');
      btn.innerHTML = '<span class="google-spinner" aria-hidden="true"></span> Buscando...';
      btn.setAttribute('aria-busy','true');
    }else{
      btn.disabled = false;
      btn.classList.remove('google-loading');
      btn.innerHTML = btn.dataset.googleOriginalText || 'Google';
      btn.removeAttribute('aria-busy');
    }
  });
}

async function getSupabaseAccessToken(){
  const sb = getSupabase();
  if(!sb) throw new Error('Supabase não está disponível.');
  const { data, error } = await sb.auth.getSession();
  if(error || !data?.session?.access_token){
    throw new Error('Sua sessão expirou. Faça login novamente.');
  }
  return data.session.access_token;
}

function initGoogleCodeClient(){
  const cfg=Store.getConfig();
  if(!cfg.google_client_id) return null;
  if(googleCodeClient) return googleCodeClient;
  if(!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;

  googleCodeClient = google.accounts.oauth2.initCodeClient({
    client_id: cfg.google_client_id,
    scope: GOOGLE_CONTACTS_SCOPE,
    ux_mode: 'popup',
    select_account: true,
    callback: async (response)=>{
      try{
        if(!response?.code) throw new Error('O Google não retornou o código de autorização.');
        // No modo popup, o Google usa a ORIGEM da página (protocolo+dominio, sem path)
        // como redirect_uri. Precisamos mandar esse mesmo valor pra edge function usar
        // na troca do code pelos tokens, senão o Google recusa com redirect_uri_mismatch.
        await conectarGoogleComCodigo(response.code, window.location.origin);
        await carregarContatosGoogle();
      }catch(error){
        console.error('Erro OAuth Google:', error);
        alert(error?.message || 'Não foi possível conectar ao Google.');
      }
    }
  });
  return googleCodeClient;
}

async function chamarGoogleFunction(payload){
  const supabaseToken = await getSupabaseAccessToken();
  const response = await fetch(GOOGLE_FUNCTION_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+supabaseToken
    },
    body:JSON.stringify(payload)
  });
  const data = await response.json().catch(()=>({}));
  if(!response.ok || !data?.ok){
    const err = new Error(data?.error || 'Erro na integração com o Google.');
    err.status = response.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function conectarGoogleComCodigo(code, redirectUri){
  return await chamarGoogleFunction({ action:'connect', code, redirect_uri: redirectUri });
}

async function verificarConexaoGoogle(){
  return await chamarGoogleFunction({ action:'status' });
}

async function carregarContatosGoogle(){
  try{
    const data = await chamarGoogleFunction({ action:'contacts' });
    googleContatosCache = (data.contatos || [])
      .map(c=>({
        ...c,
        nome:c.nome || '',
        telefone:c.telefone || '',
        email:c.email || '',
        endereco:c.endereco || '',
        dados:c.dados || {}
      }))
      .filter(c=>c.nome || c.telefone || c.email || c.endereco || Object.keys(c.dados || {}).length)
      .sort((a,b)=>(a.nome || a.telefone || a.email).localeCompare((b.nome || b.telefone || b.email),'pt-BR'));

    console.log('Contatos Google carregados:', googleContatosCache.length);
    abrirPickerContatos();
  }catch(e){
    console.error('Erro contatos Google:',e);
    alert(e?.message || 'Não foi possível buscar os contatos do Google.');
  }finally{
    setGoogleBuscaLoading(false);
  }
}

async function buscarGoogleContatos(){
  setGoogleBuscaLoading(true);
  try{
    const cfg=Store.getConfig();
    if(!cfg.google_client_id){
      alert('Configure o "Google Client ID" na aba Configurações para habilitar a busca automática de contatos.');
      mostrarAba('config');
      return;
    }

    try{
      const status=await verificarConexaoGoogle();
      if(status?.connected){
        await carregarContatosGoogle();
        return;
      }
    }catch(e){
      console.warn('Não foi possível verificar a conexão Google:',e);
    }

    const client=initGoogleCodeClient();
    if(!client){
      alert('Biblioteca do Google ainda carregando, tente novamente em instantes.');
      return;
    }
    client.requestCode();
  }catch(e){
    console.error('Erro iniciando Google:',e);
    setGoogleBuscaLoading(false);
    alert(e?.message || 'Não foi possível iniciar a integração Google.');
  }
}

function abrirPickerContatos(){
  const filtro=document.getElementById('google-contatos-filtro');
  if(filtro) filtro.value='';
  renderContatosGoogleLista(googleContatosCache);
  const modal=document.getElementById('modal-google-contatos');
  if(modal) modal.classList.remove('hidden');
}

function renderContatosGoogleLista(lista){
  const el=document.getElementById('google-contatos-lista');
  if(!el) return;
  const limite=lista.slice(0,500);
  el.innerHTML=limite.map(c=>{
    const idx=googleContatosCache.indexOf(c);
    const titulo=c.nome || c.telefone || c.email || 'Contato sem nome';
    const phones=(c.dados?.phoneNumbers||[]).map(x=>x?.value).filter(Boolean).join(' • ');
    const emails=(c.dados?.emailAddresses||[]).map(x=>x?.value).filter(Boolean).join(' • ');
    const resumo=[phones||c.telefone, emails||c.email].filter(Boolean).join(' • ');
    return `<button onclick="selecionarContatoGoogle(${idx})" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-100 text-xs border-b"><b>${esc(titulo)}</b>${resumo?`<br><span class="text-zinc-500 break-words">${esc(resumo)}</span>`:''}</button>`;
  }).join('') || '<div class="text-xs text-zinc-500 p-2">Nenhum contato encontrado</div>';

  if(lista.length>500){
    el.insertAdjacentHTML('beforeend','<div class="text-[11px] text-zinc-500 p-2">Mostrando os primeiros 500 resultados. Use a busca para localizar outros contatos.</div>');
  }
}

function normalizarBuscaGoogle(valor){
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function filtrarContatosGoogle(){
  const q=normalizarBuscaGoogle(
    document.getElementById('google-contatos-filtro')?.value || ''
  );

  if(!q){
    renderContatosGoogleLista(googleContatosCache);
    return;
  }

  const filtrados=googleContatosCache.filter(c=>{
    const texto=[
      c.nome,
      c.telefone,
      c.email,
      c.endereco,
      Object.entries(c.dados || {}).map(([k,v])=>valorLegivelGoogle(v,k)).join(' ')
    ].map(normalizarBuscaGoogle).join(' ');

    return texto.includes(q);
  });

  renderContatosGoogleLista(filtrados);
}

let googleContatoAtual = null;

function rotuloCampoGoogle(chave){
  const mapa={
    names:'Nomes', phoneNumbers:'Telefones', emailAddresses:'E-mails', addresses:'Endereços',
    organizations:'Organizações / empresas', birthdays:'Aniversários', urls:'Sites e links',
    calendarUrls:'Calendário', biographies:'Biografia / notas', nicknames:'Apelidos', occupations:'Profissões',
    relations:'Relações', events:'Datas / eventos', interests:'Interesses', skills:'Habilidades',
    imClients:'Mensageiros', locales:'Idiomas / localidades', memberships:'Grupos',
    userDefined:'Campos personalizados', sipAddresses:'Endereços SIP', residences:'Residências',
    genders:'Gênero', ageRanges:'Faixa etária', photos:'Fotos', coverPhotos:'Fotos de capa',
    locations:'Localizações', miscKeywords:'Palavras-chave', externalIds:'Identificadores externos',
    clientData:'Dados personalizados', resourceName:'Identificador do contato', etag:'ETag', metadata:'Dados técnicos'
  };
  return mapa[chave] || chave;
}

function valorSimplesGoogle(valor){
  if(valor===null || valor===undefined || valor==='') return '';
  if(typeof valor==='string' || typeof valor==='number' || typeof valor==='boolean') return String(valor);
  return '';
}

function dataGoogle(valor){
  if(!valor || typeof valor!=='object') return '';
  const ano=valor.year ? String(valor.year).padStart(4,'0') : '';
  const mes=valor.month ? String(valor.month).padStart(2,'0') : '';
  const dia=valor.day ? String(valor.day).padStart(2,'0') : '';
  if(ano && mes && dia) return `${dia}/${mes}/${ano}`;
  if(mes && dia) return `${dia}/${mes}`;
  if(ano) return ano;
  return '';
}

function campoInternoGoogle(chave){
  return ['metadata','resourceName','etag'].includes(chave);
}

function itemLegivelGoogle(chave,item){
  if(item===null || item===undefined || item==='') return '';
  if(typeof item==='string' || typeof item==='number' || typeof item==='boolean') return String(item);

  if(chave==='names'){
    const partes=[];
    if(item.displayName) partes.push(item.displayName);
    const detalhes=[];
    if(item.givenName && item.givenName!==item.displayName) detalhes.push(`Nome: ${item.givenName}`);
    if(item.middleName) detalhes.push(`Nome do meio: ${item.middleName}`);
    if(item.familyName) detalhes.push(`Sobrenome: ${item.familyName}`);
    if(item.displayNameLastFirst) detalhes.push(`Sobrenome primeiro: ${item.displayNameLastFirst}`);
    if(item.phoneticFullName) detalhes.push(`Nome fonético: ${item.phoneticFullName}`);
    return [...partes,...detalhes].join(' • ');
  }

  if(chave==='phoneNumbers'){
    return [item.value, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(chave==='emailAddresses'){
    return [item.value, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(chave==='addresses'){
    const principal=item.formattedValue || [
      item.streetAddress, item.extendedAddress, item.city, item.region,
      item.postalCode, item.country
    ].filter(Boolean).join(', ');
    const extras=[];
    if(item.type || item.formattedType) extras.push(item.formattedType || item.type);
    if(item.poBox) extras.push(`Caixa postal: ${item.poBox}`);
    return [principal,...extras].filter(Boolean).join(' • ');
  }

  if(chave==='organizations'){
    return [item.name, item.title, item.department, item.jobDescription].filter(Boolean).join(' • ');
  }

  if(['birthdays','events'].includes(chave)){
    return [dataGoogle(item.date), item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(['urls','calendarUrls'].includes(chave)){
    return [item.url, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(['biographies','nicknames','occupations','interests','skills','locales','genders','ageRanges','miscKeywords'].includes(chave)){
    return [item.value, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(chave==='relations'){
    return [item.person, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(chave==='imClients'){
    return [item.username, item.formattedProtocol || item.protocol, item.formattedType || item.type].filter(Boolean).join(' • ');
  }

  if(chave==='memberships'){
    return [item.contactGroupMembership?.contactGroupResourceName, item.contactGroupMembership?.contactGroupId].filter(Boolean).join(' • ');
  }

  if(chave==='userDefined'){
    return [item.key, item.value].filter(Boolean).join(': ');
  }

  if(chave==='sipAddresses'){
    return [item.value, item.formattedType || item.type, item.label ? `Etiqueta: ${item.label}` : ''].filter(Boolean).join(' • ');
  }

  if(chave==='locations'){
    return [item.value, item.type, item.label].filter(Boolean).join(' • ');
  }

  if(chave==='photos' || chave==='coverPhotos'){
    return item.url || '';
  }

  if(typeof item==='object'){
    const partes=[];
    for(const [k,v] of Object.entries(item)){
      if(k==='metadata' || k==='source' || k==='resourceName' || k==='etag') continue;
      const simples=valorSimplesGoogle(v);
      if(simples) partes.push(`${rotuloCampoGoogle(k)}: ${simples}`);
    }
    return partes.join(' • ');
  }
  return String(item);
}

function valorLegivelGoogle(valor, chave=''){
  if(valor===null || valor===undefined || valor==='') return '';
  if(Array.isArray(valor)) return valor.map(item=>itemLegivelGoogle(chave,item)).filter(Boolean).join(' • ');
  return itemLegivelGoogle(chave,valor);
}

function renderCampoCompletoGoogle(chave, valor){
  if(campoInternoGoogle(chave)) return '';
  if(valor===null || valor===undefined || valor==='' || (Array.isArray(valor)&&!valor.length)) return '';
  const itens=Array.isArray(valor) ? valor : [valor];
  return `<section class="border border-zinc-200 rounded-xl p-3 bg-zinc-50">
    <div class="text-[11px] font-bold uppercase tracking-wide text-zinc-600 mb-2">${esc(rotuloCampoGoogle(chave))}</div>
    <div class="space-y-2">${itens.map((item,n)=>{
      const texto=itemLegivelGoogle(chave,item);
      if(!texto) return '';
      const fotoUrl=(chave==='photos' || chave==='coverPhotos') && item && typeof item==='object' ? item.url : '';
      const link=item && typeof item==='object' && (chave==='urls' || chave==='calendarUrls') ? item.url : '';
      const linkHtml=link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-600 underline break-all block mt-1">Abrir link</a>` : '';
      return `<div class="bg-white border border-zinc-200 rounded-lg p-2">
        ${fotoUrl?`<img src="${esc(fotoUrl)}" alt="Foto do contato" class="w-20 h-20 rounded-xl object-cover border mb-2" loading="lazy">`:''}
        <div class="text-xs leading-5 break-words">${esc(texto)}</div>
        ${linkHtml}
        <button type="button" onclick='copiarTextoGoogle(${JSON.stringify(texto).replace(/'/g,"&#39;")})' class="mt-2 text-[10px] underline">Copiar${itens.length>1?` ${n+1}`:''}</button>
      </div>`;
    }).join('')}</div>
  </section>`;
}

async function copiarTextoGoogle(texto){
  if(!texto) return;
  try{ await navigator.clipboard.writeText(String(texto)); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=String(texto); document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

async function copiarTodosDadosGoogle(){
  const c=googleContatoAtual;
  if(!c) return;
  const dados=c.dados || {};
  const linhas=[];
  for(const [chave,valor] of Object.entries(dados)){
    if(campoInternoGoogle(chave)) continue;
    const texto=valorLegivelGoogle(valor,chave);
    if(texto) linhas.push(`${rotuloCampoGoogle(chave)}: ${texto}`);
  }
  await copiarTextoGoogle(linhas.join('\n'));
}

function formatarMoeda(inp){}
function parseMoeda(v){ return parseFloat((v||'').toString().replace(/[^0-9,.-]/g,'').replace(/\.(?=\d{3}(,|$))/g,'').replace(',','.'))||0; }
function fmtMoeda(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// ITENS DE SERVIÇO E MATERIAL DO ORÇAMENTO (linha a linha, com preço)
function addItemOrc(tipo, desc, valor){
  desc = desc||''; valor = valor||'';
  const containerId = tipo==='servico' ? 'orc_servicos_itens' : 'orc_materiais_itens';
  const listId = tipo==='servico' ? 'dl-servicos-precos' : 'dl-materiais-precos';
  const div=document.getElementById(containerId);
  const row=document.createElement('div');
  row.className='flex gap-2 item-row';
  row.innerHTML=`<input value="${esc(desc)}" placeholder="${tipo==='servico'?'Descrição do serviço':'Descrição do material'}" class="input flex-1 item-desc" list="${listId}" oninput="autocompletarPrecoItem(this,'${tipo}')"><input value="${esc(valor)}" placeholder="R$" class="input w-[130px] item-valor" oninput="calcSubtotaisOrc()" onblur="salvarPrecoItem(this,'${tipo}')"><button type="button" onclick="this.parentElement.remove(); calcSubtotaisOrc()" class="h-[42px] px-3 border rounded-xl text-xs">X</button>`;
  div.appendChild(row);
}
function getItensOrc(tipo){
  const containerId = tipo==='servico' ? 'orc_servicos_itens' : 'orc_materiais_itens';
  const rows=[...document.getElementById(containerId).children];
  return rows.map(r=>({
    desc: r.querySelector('.item-desc')?.value?.trim()||'',
    valor: r.querySelector('.item-valor')?.value?.trim()||''
  })).filter(i=>i.desc||i.valor);
}
function setItensOrc(tipo, lista){
  const containerId = tipo==='servico' ? 'orc_servicos_itens' : 'orc_materiais_itens';
  document.getElementById(containerId).innerHTML='';
  (lista||[]).forEach(i=>addItemOrc(tipo, i.desc||i.descricao||'', i.valor||''));
  calcSubtotaisOrc();
}
function calcSubtotaisOrc(){
  const servicos=getItensOrc('servico');
  const materiais=getItensOrc('material');
  const subServ=servicos.reduce((s,i)=>s+parseMoeda(i.valor),0);
  const subMat=materiais.reduce((s,i)=>s+parseMoeda(i.valor),0);
  document.getElementById('orc_subtotal_servicos').textContent=fmtMoeda(subServ);
  document.getElementById('orc_subtotal_materiais').textContent=fmtMoeda(subMat);
  if(servicos.length) document.getElementById('orc_valor_mao_obra').value = fmtMoeda(subServ);
  if(materiais.length) document.getElementById('orc_valor_materiais').value = fmtMoeda(subMat);
  calcTotalOrc();
}
function calcTotalOrc(){
  const mo=parseMoeda(document.getElementById('orc_valor_mao_obra').value);
  const mat=parseMoeda(document.getElementById('orc_valor_materiais').value);
  const tot=mo+mat;
  if(tot>0) document.getElementById('orc_valor_total').value = fmtMoeda(tot);
  document.getElementById('orc_valor').value = document.getElementById('orc_valor_total').value;
}
function autocompletarPrecoItem(input, tipo){
  const val=(input.value||'').trim();
  const map = tipo==='servico' ? Store.getServicosComPreco() : Store.getMateriaisComPreco();
  if(map[val]!=null){
    const row=input.closest('.item-row');
    const valorInput=row.querySelector('.item-valor');
    if(valorInput && !valorInput.value){ valorInput.value = map[val]; calcSubtotaisOrc(); }
  }
}
function salvarPrecoItem(input, tipo){
  const row=input.closest('.item-row');
  const desc=row.querySelector('.item-desc')?.value?.trim();
  const valor=input.value?.trim();
  if(!desc || !valor) return;
  if(tipo==='servico') Store.addServicoPreco(desc, valor); else Store.addMaterialPreco(desc, valor);
  preencherDatalists();
}

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtData(d){
  if(!d) return '';
  try{
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){
      const parts=d.split('-');
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    const dt = new Date(d);
    if(!isNaN(dt.getTime()) && String(d).length>4) return dt.toLocaleDateString('pt-BR');
    return d;
  }catch{return d}
}

function abrirPreviaImpressao(html){
  const w = window.open('', '_blank');
  if(!w){ alert('Seu navegador bloqueou a janela de pré-visualização. Permita pop-ups para este site e tente novamente.'); return; }
  const toolbar = `<div id="print-toolbar" class="no-print" style="position:static;background:#18181b;color:#fff;padding:12px 18px;display:flex;gap:10px;justify-content:flex-end;align-items:center;z-index:999">
    <span style="font-size:12px;opacity:.7;margin-right:auto">Pré-visualização — confira antes de imprimir</span>
    <button onclick="window.print()" style="background:#ffbf00;color:#111;border:none;padding:9px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">🖨️ Imprimir / Salvar PDF</button>
    <button onclick="window.close()" style="background:transparent;color:#fff;border:1px solid #52525b;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px">Fechar</button>
  </div>`;
  const finalHtml = html.replace('<body>', '<body>'+toolbar);
  w.document.open(); w.document.write(finalHtml); w.document.close();
  // Garantia extra (além do CSS @media print): força esconder a barra no exato momento de imprimir,
  // caso algum navegador/driver de impressão ignore a regra @media print.
  const travarBarra = ()=>{
    const tb = w.document.getElementById('print-toolbar');
    if(!tb) return;
    w.addEventListener('beforeprint', ()=>{ tb.style.setProperty('display','none','important'); });
    w.addEventListener('afterprint', ()=>{ tb.style.removeProperty('display'); });
  };
  if(w.document.readyState==='complete') travarBarra(); else w.addEventListener('load', travarBarra);
}

let _sessaoAtual = null;
function getSessao(){ return _sessaoAtual; }
function isAdmin(){ const s=getSessao(); return !!s && s.role==='admin'; }
function isLogado(){ return !!getSessao(); }
function papelDoUsuario(user){
  const role = user?.user_metadata?.role;
  return role==='admin' ? 'admin' : 'operador';
}
function sessaoDoUsuario(user){
  return { email:user.email, role:papelDoUsuario(user), nome:user.user_metadata?.nome||user.email, ts:Date.now() };
}
async function fazerLogin(){
  const token = document.querySelector('[name="cf-turnstile-response"]')?.value;
  if(!token){ alert("Confirme que você não é um robô"); return; }
  const email=(document.getElementById('login-email').value||'').trim().toLowerCase();
  const senha=(document.getElementById('login-senha').value||'');
  const erroEl=document.getElementById('login-erro');
  const infoEl=document.getElementById('login-info');
  const btn=document.getElementById('btn-login');
  erroEl.classList.add('hidden'); infoEl.classList.add('hidden');
  const sb=getSupabase();
  if(!sb){ erroEl.textContent='Não foi possível conectar ao Supabase. Verifique sua internet e tente novamente.'; erroEl.classList.remove('hidden'); return; }
  if(!email || !senha){ erroEl.textContent='Preencha email e senha'; erroEl.classList.remove('hidden'); return; }
  btn.disabled=true; btn.textContent='Entrando...';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha, options: { captchaToken: token } });
    if(error || !data?.user){
      erroEl.textContent = (error && error.message==='Invalid login credentials') ? 'Email ou senha incorretos' : (error?.message || 'Erro ao entrar');
      erroEl.classList.remove('hidden');
      return;
    }
    _sessaoAtual = sessaoDoUsuario(data.user);
    mostrarApp();
  }catch(e){
    erroEl.textContent = 'Erro inesperado: ' + (e.message||e);
    erroEl.classList.remove('hidden');
  }finally{
    btn.disabled=false; btn.textContent='Entrar';
    if(window.turnstile) window.turnstile.reset();
  }
}
async function esqueciSenha(){
  const token = document.querySelector('[name="cf-turnstile-response"]')?.value;
  if(!token){ alert("Confirme que você não é um robô"); return; }
  const email=(document.getElementById('login-email').value||'').trim().toLowerCase();
  const erroEl=document.getElementById('login-erro');
  const infoEl=document.getElementById('login-info');
  erroEl.classList.add('hidden'); infoEl.classList.add('hidden');
  if(!email){ erroEl.textContent='Digite seu email no campo acima primeiro'; erroEl.classList.remove('hidden'); return; }
  const sb=getSupabase();
  if(!sb){ erroEl.textContent='Não foi possível conectar ao Supabase.'; erroEl.classList.remove('hidden'); return; }
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: "https://manoelpedra.com.br/gestor-service/", captchaToken: token });
    if(error){ erroEl.textContent=error.message; erroEl.classList.remove('hidden'); return; }
    infoEl.textContent='Se este email estiver cadastrado, enviamos um link para redefinir a senha.';
    infoEl.classList.remove('hidden');
  }catch(e){
    erroEl.textContent = 'Erro inesperado: ' + (e.message||e);
    erroEl.classList.remove('hidden');
  }finally{
    if(window.turnstile) window.turnstile.reset();
  }
}
async function fazerLogout(){ const sb=getSupabase(); if(sb) await sb.auth.signOut(); _sessaoAtual=null; location.reload(); }
async function salvarNovaSenha(){
  const s1=document.getElementById('nova-senha-1').value||'';
  const s2=document.getElementById('nova-senha-2').value||'';
  const erroEl=document.getElementById('nova-senha-erro');
  const btn=document.getElementById('btn-nova-senha');
  erroEl.classList.add('hidden');
  if(s1.length<6){ erroEl.textContent='A senha precisa ter pelo menos 6 caracteres'; erroEl.classList.remove('hidden'); return; }
  if(s1!==s2){ erroEl.textContent='As senhas não são iguais'; erroEl.classList.remove('hidden'); return; }
  const sb=getSupabase();
  if(!sb){ erroEl.textContent='Não foi possível conectar ao Supabase.'; erroEl.classList.remove('hidden'); return; }
  btn.disabled=true; btn.textContent='Salvando...';
  const { data, error } = await sb.auth.updateUser({ password: s1 });
  btn.disabled=false; btn.textContent='Salvar nova senha';
  if(error){ erroEl.textContent=error.message; erroEl.classList.remove('hidden'); return; }
  document.getElementById('tela-nova-senha').classList.add('hidden');
  if(data?.user){ _sessaoAtual=sessaoDoUsuario(data.user); mostrarApp(); }
  else { document.getElementById('tela-login').classList.remove('hidden'); }
  // limpa o token da URL
  history.replaceState(null, '', window.location.pathname);
}
async function initAuth(){
  const sb=getSupabase();
  if(!sb){ document.getElementById('tela-login').classList.remove('hidden'); return; }
  // Verifica ANTES de tudo se a URL veio de um link de recuperação de senha
  // (#access_token=...&type=recovery ou ?type=recovery). Isso evita a corrida
  // em que getSession() já enxerga a sessão temporária criada pelo token e
  // manda o usuário direto pro app, sem passar pela tela de nova senha.
  const urlTemRecovery = window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery');
  if(urlTemRecovery){
    document.getElementById('tela-login').classList.add('hidden');
    document.getElementById('tela-nova-senha').classList.remove('hidden');
  }
  // Se o usuário veio do link de "esqueci minha senha", o Supabase dispara PASSWORD_RECOVERY
  // ao processar o token que está na própria URL (#access_token=...&type=recovery).
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){ _sessaoAtual=null; }
    if(event==='PASSWORD_RECOVERY'){
      document.getElementById('tela-login').classList.add('hidden');
      document.getElementById('tela-nova-senha').classList.remove('hidden');
    }
  });
  try{
    const { data } = await sb.auth.getSession();
    const naTelaRecuperacao = !document.getElementById('tela-nova-senha').classList.contains('hidden');
    if(naTelaRecuperacao) return; // aguarda o usuário definir a nova senha
    if(data?.session?.user){ _sessaoAtual=sessaoDoUsuario(data.session.user); mostrarApp(); }
    else { document.getElementById('tela-login').classList.remove('hidden'); }
  }catch(e){ document.getElementById('tela-login').classList.remove('hidden'); }
}
