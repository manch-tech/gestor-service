<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor V5 - Corrigido</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Inter,sans-serif}
input,textarea,select{color:#000!important;background:#fff!important;border:1px solid #d4d4d8!important}
body{background:#f6f5f3}
.tab-a{background:#09090b;color:#fff}
.tab{color:#71717a}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   CONFIG
   Troque pela sua URL e chave publica (anon) do Supabase.
   Voce tambem precisa, no painel do Supabase:
   1) Authentication > Users: criar o usuario (email+senha) que vai logar.
   2) Table editor: criar as tabelas abaixo (SQL sugerido no final do arquivo).
   ========================================================= */
const SUPA_URL="https://wybgqdreqylrojdxijey.supabase.co";
const SUPA_KEY="sb_publishable_9WipqtAt_5CwaKdc1hbPOA_0O43S7go";
const CLIENT_ID="1059683154604-9qus1i6rv4hfq3a90m6d5bdd0cedtr5g.apps.googleusercontent.com";
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

/* =========================================================
   ESTADO
   ========================================================= */
let tab="orc";
let logged=false;
let userEmail="";
let userId=null;
let toast="";
let showGoogle=false;
let gContacts=[];
let gLoad=false;
let loginBusy=false;
let loginError="";

let selectedNome="";
let selectedTel="";
let selectedEnd="";

let header={nome:"Manoel Pedra",tel:"",end:"",cnpj:""};
try{let h=localStorage.getItem("mp_header");if(h)header=JSON.parse(h);}catch(e){}

let nextItemId=2;
let itens=[{id:1,nome:"Conserto cano pvc",un:"pt",qtd:1,mo:600,mat:150}];

/* =========================================================
   HELPERS
   ========================================================= */

// Evita quebra de HTML e XSS: escapa qualquer valor antes de injetar no innerHTML
function esc(v){
  if(v===undefined||v===null)return"";
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function calcTotal(){
  let t=0;
  for(let i=0;i<itens.length;i++){
    t+=(parseFloat(itens[i].mo)||0)+(parseFloat(itens[i].mat)||0);
  }
  return t;
}

function fmt(n){
  return (n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function showToast(m){
  toast=m;
  render();
  setTimeout(function(){toast="";render()},3000);
}

function updateTotalDisplay(){
  let el=document.getElementById("totalOrc");
  if(el)el.innerText="R$ "+fmt(calcTotal());
}

/* =========================================================
   AUTENTICACAO REAL (Supabase Auth)
   Antes so verificava senha fixa no codigo-fonte, visivel a
   qualquer pessoa que abrisse o HTML. Agora a senha e checada
   pelo servidor do Supabase, nunca fica no cliente.
   ========================================================= */
async function login(){
  loginError="";
  let e=document.getElementById("email").value.trim();
  let p=document.getElementById("pass").value;
  if(!e||!p){loginError="Informe email e senha.";render();return;}
  loginBusy=true;render();
  const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});
  loginBusy=false;
  if(error){
    loginError="Erro ao entrar: "+error.message;
    render();
    return;
  }
  logged=true;
  userEmail=data.user.email;
  userId=data.user.id;
  render();
}

async function logout(){
  await supa.auth.signOut();
  logged=false;userEmail="";userId=null;
  render();
}

async function restoreSession(){
  const {data}=await supa.auth.getSession();
  if(data && data.session){
    logged=true;
    userEmail=data.session.user.email;
    userId=data.session.user.id;
  }
  render();
}

/* =========================================================
   GOOGLE CONTATOS (inalterado na logica, so com escape no render)
   ========================================================= */
async function importGoogle(){
  try{
    if(navigator.contacts && window.ContactsManager){
      let props=["name","tel","address"];
      let c=await navigator.contacts.select(props,{multiple:false});
      if(c && c[0]){
        selectedNome=c[0].name[0];
        selectedTel=c[0].tel[0];
        if(c[0].address && c[0].address[0]){
          let a=c[0].address[0];
          selectedEnd=[a.addressLine,a.city,a.region,a.postalCode].filter(Boolean).join(", ");
        }
        showToast("Contato do celular OK");
        render();
        return;
      }
    }
  }catch(e){}
  gLoad=true;render();
  try{
    if(typeof google==="undefined"||!google.accounts){
      showToast("Carregando Google...");
      gLoad=false;render();
      setTimeout(importGoogle,1500);
      return;
    }
    let client=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:"https://www.googleapis.com/auth/contacts.readonly",
      ux_mode:"popup",
      prompt:"",
      callback:async function(r){
        if(r && r.access_token){
          try{
            let resp=await fetch("https://people.googleapis.com/v1/people/me/connections?personFields=names,phoneNumbers,emailAddresses,addresses&pageSize=200",{headers:{Authorization:"Bearer "+r.access_token}});
            let data=await resp.json();
            if(data.error){
              showToast("Ative People API - "+data.error.message);
              gLoad=false;render();return;
            }
            gContacts=(data.connections||[]).map(function(p){
              return{
                name:p.names?p.names[0].displayName:"Sem nome",
                phone:p.phoneNumbers?p.phoneNumbers[0].value:"",
                email:p.emailAddresses?p.emailAddresses[0].value:"",
                address:p.addresses?(p.addresses[0].formattedValue||""):""
              };
            });
            showGoogle=true;
          }catch(e){showToast("Erro ao buscar: "+e.message);}
        }
        gLoad=false;render();
      },
      error_callback:function(err){
        gLoad=false;
        if(err.type==="access_denied"){
          showToast("Google bloqueou. Adicione seu dominio em Origens JS e seu email em Usuarios de teste.");
        }else{
          showToast("Erro Google: "+(err.message||err.type));
        }
        render();
      }
    });
    client.requestAccessToken({prompt:""});
  }catch(e){gLoad=false;showToast("Erro: "+e.message);render();}
}
function pickGoogle(i){
  let c=gContacts[i];
  selectedNome=c.name;
  selectedTel=c.phone;
  selectedEnd=c.address||"";
  showGoogle=false;
  showToast("Selecionado: "+c.name);
  render();
}

/* =========================================================
   CONFIG - CABECALHO
   ========================================================= */
function saveHeader(){
  let n=document.getElementById("h_nome");if(n)header.nome=n.value;
  let t=document.getElementById("h_tel");if(t)header.tel=t.value;
  let e=document.getElementById("h_end");if(e)header.end=e.value;
  let c=document.getElementById("h_cnpj");if(c)header.cnpj=c.value;
  localStorage.setItem("mp_header",JSON.stringify(header));
}

/* =========================================================
   ITENS DO ORCAMENTO
   Corrigido: agora todo campo tem oninput ligado ao array real,
   e a atualizacao do total acontece sem re-renderizar a tela
   inteira (isso evita perder o foco/cursor enquanto se digita).
   ========================================================= */
function itemById(id){
  for(let i=0;i<itens.length;i++)if(itens[i].id===id)return itens[i];
  return null;
}
function updateItemField(id,field,value){
  let it=itemById(id);
  if(!it)return;
  it[field]=value;
  updateTotalDisplay();
}
function addItem(){
  itens.push({id:nextItemId++,nome:"",un:"pt",qtd:1,mo:0,mat:0});
  render();
}
function removeItem(id){
  itens=itens.filter(function(it){return it.id!==id;});
  render();
}

/* =========================================================
   SALVAR NO SUPABASE
   Antes o cliente 'supa' era criado mas nunca usado -
   nada era persistido de verdade. Agora cada aba grava
   na tabela correspondente (ver SQL no fim do arquivo).
   ========================================================= */
async function salvarOrcamento(){
  let nome=document.getElementById("orc_nome").value.trim();
  let tel=document.getElementById("orc_tel").value.trim();
  let end=document.getElementById("orc_end").value.trim();
  if(!nome){showToast("Informe o nome do cliente");return;}
  let payload={
    cliente_nome:nome,
    cliente_tel:tel,
    cliente_end:end,
    itens:itens,
    total:calcTotal(),
    user_id:userId
  };
  const {error}=await supa.from("orcamentos").insert(payload);
  if(error){showToast("Erro ao salvar: "+error.message);return;}
  showToast("Orcamento salvo - R$ "+fmt(calcTotal()));
}

async function salvarOS(){
  let cliente=document.getElementById("os_cliente").value.trim();
  let escopo=document.getElementById("os_escopo").value.trim();
  if(!cliente){showToast("Informe o cliente");return;}
  const {error}=await supa.from("ordens_servico").insert({
    cliente_nome:cliente,escopo:escopo,user_id:userId
  });
  if(error){showToast("Erro ao salvar: "+error.message);return;}
  showToast("Ordem de servico salva");
  document.getElementById("os_cliente").value="";
  document.getElementById("os_escopo").value="";
}

async function salvarTermo(){
  let cliente=document.getElementById("termo_cliente").value.trim();
  if(!cliente){showToast("Informe o cliente");return;}
  let pintura=document.getElementById("termo_pintura").checked;
  let eletrica=document.getElementById("termo_eletrica").checked;
  let hidraulica=document.getElementById("termo_hidraulica").checked;
  const {error}=await supa.from("termos_entrega").insert({
    cliente_nome:cliente,
    pintura_ok:pintura,eletrica_ok:eletrica,hidraulica_ok:hidraulica,
    user_id:userId
  });
  if(error){showToast("Erro ao salvar: "+error.message);return;}
  showToast("Termo de entrega salvo");
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  let app=document.getElementById("app");
  if(!logged){
    app.innerHTML=
      "<div class='min-h-screen flex items-center justify-center p-4 bg-zinc-900'>"+
      "<div class='bg-white rounded-[24px] p-6 max-w-[340px] w-full'>"+
      "<div class='w-10 h-10 bg-zinc-900 text-white rounded-full flex items-center justify-center font-bold mb-3'>GS</div>"+
      "<h1 class='font-bold text-[18px] text-black'>Gestor</h1>"+
      "<p class='text-[11px] text-zinc-500 mb-3'>Entre com seu email e senha cadastrados no Supabase</p>"+
      "<input id='email' placeholder='email' class='w-full border rounded-xl px-3 py-2 text-[13px] mb-2'>"+
      "<input id='pass' type='password' placeholder='senha' class='w-full border rounded-xl px-3 py-2 text-[13px] mb-3'>"+
      (loginError?"<p class='text-[10px] text-red-600 mb-2'>"+esc(loginError)+"</p>":"")+
      "<button "+(loginBusy?"disabled":"")+" onclick='login()' class='w-full bg-zinc-900 text-white rounded-full py-2.5 font-bold text-[13px] disabled:opacity-50'>"+(loginBusy?"Entrando...":"Entrar")+"</button>"+
      "</div></div>";
    return;
  }
  let top="<div class='bg-zinc-900 text-white px-3 py-2 flex justify-between'>"+
    "<div class='flex items-center gap-2'>"+
    "<div class='w-7 h-7 bg-white text-black rounded-full flex items-center justify-center font-bold text-[10px]'>GS</div>"+
    "<div><div class='font-bold text-[11px]'>"+esc(header.nome)+"</div>"+
    "<div class='text-[9px] text-zinc-400'>"+esc(userEmail)+"</div></div></div>"+
    "<button onclick='logout()' class='text-[9px] border border-zinc-700 rounded-full px-2 py-1'>Sair</button></div>";

  let tabs="<div class='bg-white border-b flex gap-1 px-2 overflow-auto'>"+
    "<button onclick=\"tab='dash';render()\" class='px-2 py-2 text-[9px] font-bold "+(tab==="dash"?"tab-a rounded-t-lg":"tab")+"'>DASH</button>"+
    "<button onclick=\"tab='orc';render()\" class='px-2 py-2 text-[9px] font-bold "+(tab==="orc"?"tab-a rounded-t-lg":"tab")+"'>ORC</button>"+
    "<button onclick=\"tab='os';render()\" class='px-2 py-2 text-[9px] font-bold "+(tab==="os"?"tab-a rounded-t-lg":"tab")+"'>OS</button>"+
    "<button onclick=\"tab='termo';render()\" class='px-2 py-2 text-[9px] font-bold "+(tab==="termo"?"tab-a rounded-t-lg":"tab")+"'>TERMO</button>"+
    "<button onclick=\"tab='cfg';render()\" class='px-2 py-2 text-[9px] font-bold "+(tab==="cfg"?"tab-a rounded-t-lg":"tab")+"'>CONFIG</button>"+
    "</div>";

  let body="";
  if(tab==="cfg"){
    body="<div class='p-3 max-w-[600px] mx-auto'><div class='bg-white rounded-[18px] p-4 border'>"+
      "<h3 class='font-bold text-[12px] text-black'>CABECALHO EDITAVEL</h3>"+
      "<label class='text-[9px] font-bold'>NOME</label>"+
      "<input id='h_nome' value='"+esc(header.nome)+"' oninput='saveHeader()' class='w-full border rounded-lg px-2 py-2 text-[11px] mb-2'>"+
      "<label class='text-[9px] font-bold'>TEL</label>"+
      "<input id='h_tel' value='"+esc(header.tel)+"' oninput='saveHeader()' class='w-full border rounded-lg px-2 py-2 text-[11px] mb-2'>"+
      "<label class='text-[9px] font-bold'>CNPJ</label>"+
      "<input id='h_cnpj' value='"+esc(header.cnpj)+"' oninput='saveHeader()' class='w-full border rounded-lg px-2 py-2 text-[11px] mb-2'>"+
      "<label class='text-[9px] font-bold'>END</label>"+
      "<input id='h_end' value='"+esc(header.end)+"' oninput='saveHeader()' class='w-full border rounded-lg px-2 py-2 text-[11px]'>"+
      "</div></div>";
  } else if(tab==="dash"){
    body="<div class='p-3 max-w-[700px] mx-auto'><div class='bg-white rounded-xl p-4 border'><h3 class='font-bold text-[12px]'>Dashboard</h3><p class='text-[11px] mt-2'>Total do orcamento atual: R$ "+fmt(calcTotal())+"</p></div></div>";
  } else if(tab==="orc"){
    let itensH="";
    for(let i=0;i<itens.length;i++){
      let it=itens[i];
      itensH+="<div class='bg-zinc-50 border rounded-xl p-2 mb-2'>"+
        "<div class='flex gap-1 mb-1'>"+
        "<input value='"+esc(it.nome)+"' oninput='updateItemField("+it.id+",\"nome\",this.value)' placeholder='Servico' class='flex-1 border rounded-lg px-2 py-1.5 text-[11px]'>"+
        "<button onclick='removeItem("+it.id+")' class='px-2 rounded-lg border text-[10px] text-red-600'>x</button>"+
        "</div>"+
        "<div class='grid grid-cols-4 gap-1'>"+
        "<select onchange='updateItemField("+it.id+",\"un\",this.value)' class='border rounded-lg px-1 py-1.5 text-[10px]'>"+
        "<option value='pt' "+(it.un==="pt"?"selected":"")+">pt</option>"+
        "<option value='un' "+(it.un==="un"?"selected":"")+">un</option>"+
        "</select>"+
        "<input value='"+esc(it.qtd)+"' oninput='updateItemField("+it.id+",\"qtd\",this.value)' placeholder='Qtd' class='border rounded-lg px-1 py-1.5 text-[10px]'>"+
        "<input value='"+esc(it.mo)+"' oninput='updateItemField("+it.id+",\"mo\",this.value)' placeholder='Mao obra' class='border rounded-lg px-1 py-1.5 text-[10px]'>"+
        "<input value='"+esc(it.mat)+"' oninput='updateItemField("+it.id+",\"mat\",this.value)' placeholder='Material' class='border rounded-lg px-1 py-1.5 text-[10px]'>"+
        "</div></div>";
    }
    body="<div class='p-3 max-w-[700px] mx-auto space-y-2'>"+
      "<div class='bg-white rounded-[18px] p-3 border space-y-2'>"+
      "<div class='flex gap-2'>"+
      "<input id='orc_nome' value='"+esc(selectedNome)+"' oninput='selectedNome=this.value' placeholder='Nome cliente - clique + p/ Google' class='flex-1 border rounded-xl px-3 py-2 text-[11px]'>"+
      "<button onclick='importGoogle()' class='w-9 h-9 bg-zinc-900 text-white rounded-xl font-bold'>"+(gLoad?"...":"+ ")+"</button>"+
      "</div>"+
      "<div class='grid grid-cols-2 gap-2'>"+
      "<input id='orc_tel' value='"+esc(selectedTel)+"' oninput='selectedTel=this.value' placeholder='Tel' class='border rounded-xl px-2 py-2 text-[11px]'>"+
      "<input id='orc_end' value='"+esc(selectedEnd)+"' oninput='selectedEnd=this.value' placeholder='Endereco' class='border rounded-xl px-2 py-2 text-[11px]'>"+
      "</div>"+
      "<button onclick='salvarOrcamento()' class='w-full bg-zinc-900 text-white rounded-full py-2.5 font-bold text-[11px]'>Salvar Orcamento</button>"+
      "</div>"+
      "<div class='bg-white rounded-[18px] p-3 border'>"+itensH+
      "<button onclick='addItem()' class='w-full border border-dashed rounded-xl py-2 text-[10px] text-zinc-600 mb-2'>+ Adicionar item</button>"+
      "<div class='text-right font-bold text-[12px]'>Total <span id='totalOrc'>R$ "+fmt(calcTotal())+"</span></div></div></div>";
  } else if(tab==="os"){
    body="<div class='p-3 max-w-[600px] mx-auto'><div class='bg-white rounded-[18px] p-3 border'><h3 class='font-bold text-[12px]'>ORDEM DE SERVICO</h3>"+
      "<input id='os_cliente' placeholder='Cliente' class='w-full border rounded-xl px-3 py-2 text-[11px] mt-2'>"+
      "<textarea id='os_escopo' placeholder='Escopo' rows='3' class='w-full border rounded-xl px-3 py-2 text-[11px] mt-2'></textarea>"+
      "<button onclick='salvarOS()' class='w-full bg-zinc-900 text-white rounded-full py-2.5 font-bold text-[11px] mt-2'>Salvar OS</button></div></div>";
  } else if(tab==="termo"){
    body="<div class='p-3 max-w-[600px] mx-auto'><div class='bg-white rounded-[18px] p-3 border'><h3 class='font-bold text-[12px]'>TERMO DE ENTREGA</h3>"+
      "<input id='termo_cliente' placeholder='Cliente' class='w-full border rounded-xl px-3 py-2 text-[11px] mt-2'>"+
      "<div class='border rounded-xl p-2 mt-2'>"+
      "<label class='flex gap-1 text-[10px]'><input id='termo_pintura' type='checkbox' checked> Pintura OK</label>"+
      "<label class='flex gap-1 text-[10px]'><input id='termo_eletrica' type='checkbox' checked> Eletrica OK</label>"+
      "<label class='flex gap-1 text-[10px]'><input id='termo_hidraulica' type='checkbox' checked> Hidraulica OK</label>"+
      "</div><button onclick='salvarTermo()' class='w-full bg-zinc-900 text-white rounded-full py-2.5 font-bold text-[11px] mt-2'>Salvar Termo</button></div></div>";
  }

  let html=top+tabs+body;

  if(showGoogle){
    let list="";
    for(let i=0;i<gContacts.length;i++){
      let c=gContacts[i];
      list+="<button onclick='pickGoogle("+i+")' class='w-full text-left border rounded-lg p-2 mb-1'><div class='font-bold text-[11px]'>"+esc(c.name)+"</div><div class='text-[9px]'>"+esc(c.phone)+"</div>"+(c.address?"<div class='text-[9px] text-zinc-500'>"+esc(c.address)+"</div>":"")+"</button>";
    }
    html+="<div class='fixed inset-0 bg-black/50 flex items-center justify-center p-4'><div class='bg-white rounded-[18px] p-3 max-w-[320px] w-full max-h-[70vh] overflow-auto'><div class='font-bold text-[12px] mb-2'>Google ("+gContacts.length+")</div><div>"+list+"</div><button onclick='showGoogle=false;render()' class='w-full bg-zinc-900 text-white rounded-full py-2 mt-2 text-[10px]'>Fechar</button></div></div>";
  }
  if(toast){
    html+="<div class='fixed bottom-3 left-1/2 -translate-x-1/2 bg-zinc-900 text-white text-[10px] px-3 py-1.5 rounded-full'>"+esc(toast)+"</div>";
  }
  app.innerHTML=html;
}

restoreSession();
</script>

<!--
=========================================================
SQL para rodar uma vez no Supabase (SQL Editor):

create table orcamentos (
  id bigint generated always as identity primary key,
  cliente_nome text,
  cliente_tel text,
  cliente_end text,
  itens jsonb,
  total numeric,
  user_id uuid references auth.users(id),
  created_at timestamptz default now()
);

create table ordens_servico (
  id bigint generated always as identity primary key,
  cliente_nome text,
  escopo text,
  user_id uuid references auth.users(id),
  created_at timestamptz default now()
);

create table termos_entrega (
  id bigint generated always as identity primary key,
  cliente_nome text,
  pintura_ok boolean,
  eletrica_ok boolean,
  hidraulica_ok boolean,
  user_id uuid references auth.users(id),
  created_at timestamptz default now()
);

create policy "usuario ve so o proprio" on orcamentos
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
-- repita para as outras duas tabelas.
=========================================================
-->
</body>
</html>
