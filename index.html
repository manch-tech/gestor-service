function checkLogin(email, pass){
  const e=(email||"").toLowerCase().trim();
  const p=(pass||"").trim();
  if(p==="manoel123"||p==="admin") return true;
  if(e.includes("manoel@") && p==="123456") return true;
  if(e==="manoel" && p==="123456") return true;
  if(e==="admin" && p==="admin") return true;
  return false;
}
function Login({onLogin}){
  const [email,setEmail]=useState("manchtec@gmail.com");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const doLogin=async(e)=>{
    e?.preventDefault();
    setErr("");
    if(!email||!pass){ setErr("Preencha e-mail e senha"); return; }
    setLoading(true);
    try{
      try{
        const em=email.includes("@")?email:`${email}@gestor.local`;
        const {data,error}=await supabase.auth.signInWithPassword({email:em,password:pass});
        if(!error && data?.session){
          localStorage.setItem("mp_session",JSON.stringify({email,loggedAt:new Date().toISOString(),via:"supabase"}));
          onLogin(email); setLoading(false); return;
        }
      }catch{}
      if(checkLogin(email,pass)){
        localStorage.setItem("mp_session",JSON.stringify({email,loggedAt:new Date().toISOString(),via:"local"}));
        onLogin(email);
      } else {
        setErr("Credenciais inválidas. Tente: manoel123 / admin ou manoel + 123456");
      }
    }finally{ setLoading(false); }

function Root(){

      if(s){ const d=JSON.parse(s); if(d&&d.email){ setLogged(true); setUser(d.email); } }
    }catch{}
    setChecked(true);
  },[]);
  const onLogin=(email)=>{ setLogged(true); setUser(email); };
  const onLogout=()=>{ try{localStorage.removeItem("mp_session"); supabase.auth.signOut();}catch{} setLogged(false); setUser(""); };
  if(!checked) return React.createElement("div",{className:"min-h-screen bg-zinc-900"});
  if(!logged) return React.createElement(Login,{onLogin});
  return React.createElement(AppMain,{user,onLogout});
}
