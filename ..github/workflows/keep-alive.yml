name: Manter Supabase Vivo - App Gestor

on:
  schedule:
    - cron: '0 12 * * *'  # todo dia 09:00 no Brasil
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar Supabase App Gestor
        run: |
          curl -s "https://wybgqdreqylrojdxijey.supabase.co/rest/v1/testimonials?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
          echo "App Gestor OK - Supabase nao vai pausar"
